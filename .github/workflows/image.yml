name: image
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
env:
  IMAGE: ghcr.io/avnish80/vks-migration-studio
jobs:
  # Every pull request and push: build for amd64 and smoke-test the container.
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: studio:test
      - name: Smoke test
        run: |
          # Same hardening as the README: read-only root filesystem, only /data and /tmp writable.
          docker run -d --name studio --read-only --tmpfs /tmp -v studio-data:/data -p 127.0.0.1:8080:8080 -e STUDIO_TOKEN=$(printf 's%.0s' $(seq 1 40)) studio:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer $(printf 's%.0s' $(seq 1 40))" http://127.0.0.1:8080/api/version | tee /tmp/version.json
          grep -q '"coreModules":\["engine"' /tmp/version.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/projects)" = 401
          curl -fsS http://127.0.0.1:8080/ -o /tmp/index.html && grep -q '<div id="root">' /tmp/index.html
          test "$(curl -s --path-as-is -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/%61pi/projects)" = 401
          test "$(docker exec studio stat -c %a /data)" = 700
          docker exec studio kubectl version --client
          docker exec studio skopeo --version
          docker exec studio python3 --version
          test "$(docker exec studio id -u)" = 10001
          # The planning core runs inside the image: load the demo inventory and expect its workloads.
          T=$(printf 's%.0s' $(seq 1 40)); H="Authorization: Bearer $T"
          P=$(curl -fsS -H "$H" -H 'content-type: application/json' -d '{"name":"smoke"}' http://127.0.0.1:8080/api/projects | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST -H "$H" http://127.0.0.1:8080/api/projects/$P/demo
          test "$(curl -fsS -H "$H" http://127.0.0.1:8080/api/projects/$P/workloads | python3 -c 'import json,sys;print(len(json.load(sys.stdin)["items"]))')" = 4
      - name: Engine log
        if: always()
        run: docker logs studio || true

      # Real cluster: deploy the manifest to kind under the restricted pod security standard, give the
      # engine a read-only collector login for that cluster, and collect a real inventory through the API.
      - uses: helm/kind-action@v1
        with:
          cluster_name: studio
      - name: Deploy to kind and collect
        run: |
          set -euo pipefail
          kind load docker-image studio:test --name studio
          sed 's#image: ghcr.io/avnish80/vks-migration-studio:.*#image: studio:test#; s#imagePullPolicy: IfNotPresent#imagePullPolicy: Never#' deploy/kubernetes/vks-migration-studio.yaml | kubectl apply -f -
          ctx=$(kubectl config current-context)
          scripts/collector-kubeconfig.sh "$ctx" /tmp/collector.kubeconfig
          # The PowerShell version (for Windows jump hosts) must produce an equivalent, working login.
          pwsh -NoProfile -File scripts/collector-kubeconfig.ps1 -Context "$ctx" -Output /tmp/collector-ps.kubeconfig
          test "$(stat -c %a /tmp/collector-ps.kubeconfig)" = 600
          for f in /tmp/collector.kubeconfig /tmp/collector-ps.kubeconfig; do
            kubectl --kubeconfig "$f" get deployments -A >/dev/null
            if kubectl --kubeconfig "$f" get secrets -A >/dev/null 2>&1; then echo "$f can read Secrets"; exit 1; fi
            if kubectl --kubeconfig "$f" get pods -A >/dev/null 2>&1; then echo "$f can read Pods"; exit 1; fi
            if kubectl --kubeconfig "$f" -n default create configmap probe --from-literal=a=b >/dev/null 2>&1; then echo "$f can write"; exit 1; fi
          done
          # Inside the cluster the API server is kubernetes.default.svc, not the host port kind exposes.
          sed -i 's#server: .*#server: https://kubernetes.default.svc#' /tmp/collector.kubeconfig
          kubectl -n vks-migration-studio create secret generic studio-kubeconfig --from-file=config=/tmp/collector.kubeconfig
          kubectl -n vks-migration-studio set env deploy/vks-migration-studio STUDIO_TOKEN=$(printf 'k%.0s' $(seq 1 40))
          kubectl -n vks-migration-studio rollout status deploy/vks-migration-studio --timeout=180s
          kubectl -n vks-migration-studio port-forward svc/vks-migration-studio 18080:8080 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/health && break; sleep 1; done
          A="Authorization: Bearer $(printf 'k%.0s' $(seq 1 40))"; J='content-type: application/json'; U=http://127.0.0.1:18080/api
          curl -fsS -H "$A" $U/kube/contexts
          C=$(curl -fsS -H "$A" -H "$J" -d "{\"contextName\":\"$ctx\",\"role\":\"source\"}" $U/clusters | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          P=$(curl -fsS -H "$A" -H "$J" -d '{"name":"kind"}' $U/projects | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          curl -fsS -X PATCH -H "$A" -H "$J" -d "{\"sourceClusterId\":\"$C\"}" $U/projects/$P/clusters
          JOB=$(curl -fsS -H "$A" -H "$J" -d '{"side":"source"}' $U/projects/$P/collect | python3 -c 'import json,sys;print(json.load(sys.stdin)["jobId"])')
          for i in $(seq 1 120); do
            S=$(curl -fsS -H "$A" $U/jobs/$JOB | python3 -c 'import json,sys;j=json.load(sys.stdin);print(j["state"], j.get("error") or "")')
            case "$S" in Succeeded*) break;; Failed*) echo "$S"; exit 1;; esac; sleep 2
          done
          curl -fsS -H "$A" $U/projects/$P/workloads | python3 -c 'import json,sys;w=json.load(sys.stdin)["items"];print(len(w),"workloads");assert any(x["resource"]=="kube-system/Deployment/coredns" for x in w)'
          curl -fsS -H "$A" $U/projects/$P/snapshots | python3 -c 'import json,sys;s=json.load(sys.stdin)["items"][0];print(s["resources"],"resources; errors:",s["coverage"]["errors"]);assert not [e for e in s["coverage"]["errors"] if e["reason"]=="Forbidden"]'
      - name: Cluster engine log
        if: always()
        run: kubectl -n vks-migration-studio logs deploy/vks-migration-studio --tail=200 || true

  # Tags: multi-arch build, push to GHCR with SBOM and provenance, sign with cosign (keyless).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
